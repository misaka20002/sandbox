services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN_SHA256: ${SANDBOX_TOKEN_SHA256:?set SANDBOX_TOKEN_SHA256 in .env}
      SANDBOX_SESSION_ROOT: /data/sessions
      SANDBOX_CACHE_ROOT: /tmp/sandbox-cache
      SESSION_RETENTION_MINUTES: ${SESSION_RETENTION_MINUTES:-60}
      MAX_SESSION_BYTES: ${MAX_SESSION_BYTES:-268435456}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      DEFAULT_TIMEOUT_SECONDS: ${DEFAULT_TIMEOUT_SECONDS:-120}
      MAX_TIMEOUT_SECONDS: ${MAX_TIMEOUT_SECONDS:-300}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-2000000}
      MAX_INPUT_BYTES: ${MAX_INPUT_BYTES:-20000000}
      MAX_FILE_OUTPUT_BYTES: ${MAX_FILE_OUTPUT_BYTES:-20000000}
      MAX_STREAM_FILE_OUTPUT_BYTES: ${MAX_STREAM_FILE_OUTPUT_BYTES:-64000000}
      MAX_OUTPUT_FILES: ${MAX_OUTPUT_FILES:-8}
    volumes:
      - sandbox_sessions:/data/sessions
    tmpfs:
      - /tmp:size=512m,mode=1777
    ports:
      - "${SANDBOX_PORT:-7860}:7860"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7860/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  sandbox_sessions:
